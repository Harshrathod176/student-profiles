<title>Student Profiles</title>
<!-- Two addresses reach the same site. This one is used by default because
     some home routers refuse to resolve app.github.dev at all, which leaves
     the codespace address simply unreachable from those networks. -->
<meta http-equiv="refresh" content="0; url=https://micro-week-cities-algebra.trycloudflare.com/">
<link rel="canonical" href="https://micro-week-cities-algebra.trycloudflare.com/">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #fbfbfa; color: #1a1a18;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16161a; color: #e8e8e6; }
    a.btn { background: #e8e8e6 !important; color: #16161a !important; }
    .muted { color: #9a9a96 !important; }
    a.alt { color: #9a9a96 !important; }
  }
  main { text-align: center; padding: 2rem; max-width: 30rem; }
  h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 .4rem; }
  .muted { color: #6b6b66; font-size: .9rem; }
  a.btn {
    display: inline-block; margin-top: 1.5rem; padding: .7rem 1.4rem;
    background: #1a1a18; color: #fbfbfa; text-decoration: none;
    border-radius: 7px; font-weight: 500;
  }
  .note { margin-top: 2rem; font-size: .82rem; }
  a.alt { color: #6b6b66; }
</style>
</head>
<body>
<main>
  <h1>Student Profiles</h1>
  <p class="muted">Taking you to the site&hellip;</p>
  <a class="btn" href="https://micro-week-cities-algebra.trycloudflare.com/">Open it now</a>
  <p class="muted note">
    Not loading? The site runs in a codespace that shuts down when it is idle,
    so it has to be started before it will answer.
    <br><br>
    There is also a
    <a class="alt" href="https://super-couscous-vp6wjv7xx54rfp57w-8090.app.github.dev/">second address</a>,
    though some home networks cannot open that one.
  </p>
</main>
<script>
  // A meta refresh is ignored when the page is restored from the back/forward
  // cache, which would strand anyone who pressed Back. This covers that.
  location.replace("https://micro-week-cities-algebra.trycloudflare.com/");
</script>
